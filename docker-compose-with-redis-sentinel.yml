services:
  redis-master:
    image: redis:latest
    container_name: redis-master
    ports:
      - "6380:6380"
    command: redis-server --port 6380 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-slave-1:
    image: redis:latest
    container_name: redis-slave-1
    ports:
      - "6381:6381"
    command: redis-server --port 6381 --replicaof redis-master 6380
    depends_on:
      redis-master:
        condition: service_healthy

  redis-slave-2:
    image: redis:latest
    container_name: redis-slave-2
    ports:
      - "6382:6382"
    command: redis-server --port 6382 --replicaof redis-master 6380
    depends_on:
      redis-master:
        condition: service_healthy

  sentinel-1:
    image: redis:latest
    container_name: sentinel-1
    user: root
    ports:
      - "26380:26380"
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf
    # We use the config file we just fixed
    command: redis-server /etc/redis/sentinel.conf --sentinel
    depends_on:
      redis-master:
        condition: service_healthy
  # Apply the same logic to sentinel-2 and sentinel-3...

  sentinel-2:
    image: redis:latest
    container_name: sentinel-2
    user: root
    ports:
      - "26381:26381"
    volumes:
      - ./sentinel2.conf:/etc/redis/sentinel2.conf
    # We use the config file we just fixed
    command: redis-server /etc/redis/sentinel2.conf --sentinel
    depends_on:
      redis-master:
        condition: service_healthy

  sentinel-3:
    image: redis:latest
    container_name: sentinel-3
    user: root
    ports:
      - "26382:26382"
    volumes:
      - ./sentinel3.conf:/etc/redis/sentinel3.conf
    # We use the config file we just fixed
    command: redis-server /etc/redis/sentinel3.conf --sentinel
    depends_on:
      redis-master:
        condition: service_healthy
        
networks:
  redis-net:
    driver: bridge